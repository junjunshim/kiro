<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단계별 AI 교육 - AI 배움터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    /* =====================================================
       팀원 C 담당 - 단계별 AI 교육 전용 스타일
       shared/style.css의 공통 변수와 클래스를 사용합니다.
       ===================================================== */
    .education-overview {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .education-overview__title {
      font-size: var(--font-size-lg);
    }

    .education-overview__description {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .level-section {
      display: grid;
      gap: 1rem;
    }

    .level-section__title {
      font-size: var(--font-size-lg);
    }

    .level-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .level-tab {
      width: 100%;
      flex-direction: column;
      gap: 0.25rem;
      border: 2px solid transparent;
    }

    .level-tab[aria-selected="true"] {
      border-color: var(--color-primary-dark);
    }

    .level-tab__name {
      font-size: var(--font-size-lg);
    }

    .level-tab__summary {
      font-size: var(--font-size-sm);
      font-weight: 400;
    }

    .level-panel {
      display: grid;
      gap: 1rem;
      border: 2px solid var(--color-primary);
    }

    .level-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .level-panel__title {
      font-size: var(--font-size-xl);
    }

    .level-panel__description {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .lesson-preview-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      list-style: none;
    }

    .lesson-preview {
      display: grid;
      align-content: start;
      gap: 0.5rem;
      padding: 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-bg);
    }

    .lesson-preview__number {
      color: var(--color-primary-dark);
      font-size: var(--font-size-sm);
      font-weight: 700;
    }

    .lesson-preview__title {
      font-size: var(--font-size-lg);
    }

    .lesson-preview__objective {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .next-step-notice {
      padding: 1rem;
      border-left: 4px solid var(--color-secondary);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: var(--font-size-md);
    }

    @media (max-width: 600px) {
      .level-tabs,
      .lesson-preview-list {
        grid-template-columns: 1fr;
      }

      .level-tab {
        align-items: flex-start;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <main>
    <div class="container">
      <div class="page-header">
        <h1>📚 단계별 AI 교육</h1>
        <p>초급부터 고급까지 단계별로 AI를 배울 수 있습니다.</p>
      </div>

      <section class="card education-overview" aria-labelledby="education-overview-title">
        <h2 class="education-overview__title" id="education-overview-title">나에게 맞는 단계부터 시작하세요</h2>
        <p class="education-overview__description">
          모든 단계는 자유롭게 선택할 수 있습니다. 각 단계에는 이해하기 쉬운 AI 학습 레슨이 3개씩 준비되어 있습니다.
        </p>
        <span class="badge badge-blue">전체 9개 레슨</span>
      </section>

      <section class="level-section" aria-labelledby="level-section-title">
        <h2 class="level-section__title" id="level-section-title">학습 단계 선택</h2>

        <div class="level-tabs" role="tablist" aria-label="AI 교육 학습 단계">
          <button
            class="btn btn-primary level-tab"
            id="level-tab-beginner"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="level-panel"
            data-level="beginner"
          >
            <span class="level-tab__name">🌱 초급</span>
            <span class="level-tab__summary">AI를 처음 배우는 분</span>
          </button>

          <button
            class="btn btn-secondary level-tab"
            id="level-tab-intermediate"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="level-panel"
            data-level="intermediate"
            tabindex="-1"
          >
            <span class="level-tab__name">🌿 중급</span>
            <span class="level-tab__summary">AI를 생활에 활용할 분</span>
          </button>

          <button
            class="btn btn-secondary level-tab"
            id="level-tab-advanced"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="level-panel"
            data-level="advanced"
            tabindex="-1"
          >
            <span class="level-tab__name">🌳 고급</span>
            <span class="level-tab__summary">AI를 더 정확하게 쓸 분</span>
          </button>
        </div>

        <div
          class="card level-panel"
          id="level-panel"
          role="tabpanel"
          aria-labelledby="level-tab-beginner"
          tabindex="0"
        >
          <div class="level-panel__header">
            <h2 class="level-panel__title" id="selected-level-title"></h2>
            <span class="badge badge-blue" id="selected-level-count"></span>
          </div>
          <p class="level-panel__description" id="selected-level-description"></p>
          <ol class="lesson-preview-list" id="lesson-preview-list" aria-label="선택한 단계의 레슨"></ol>
          <p class="next-step-notice">
            이번 단계에서는 학습 과정의 구성을 미리 확인할 수 있습니다. 레슨 상세 학습과 확인 퀴즈는 다음 개발 단계에서 연결됩니다.
          </p>
        </div>
      </section>
    </div>
  </main>

  <script src="shared/utils.js"></script>
  <script src="shared/nav.js"></script>
  <script>
    Utils.restoreFontSize();
    Nav.render();

    /**
     * 단계별 AI 교육 레슨 데이터

     * ID 규칙: {단계 영문}-{단계 내 순번}
     * level 값: beginner | intermediate | advanced
     * quiz.answerIndex: options 배열의 0부터 시작하는 정답 위치
     */
    const LESSONS = Object.freeze([
      {
        id: 'beginner-1',
        level: 'beginner',
        levelLabel: '초급',
        title: 'AI란 무엇인가요?',

        content: 'AI는 많은 정보를 바탕으로 사람의 질문에 답하거나 일을 돕는 기술입니다.',
        example: '스마트폰 음성 비서, 사진 자동 분류, 인터넷 검색 결과 추천도 AI 활용 사례입니다.',
        quiz: {
          question: '다음 중 AI가 활용되는 사례는 무엇인가요?',

          answerIndex: 0,
          explanation: '스마트폰 음성 비서는 사람의 말을 이해하고 답변하기 위해 AI를 활용합니다.'
        }
      },
      {
        id: 'beginner-2',
        level: 'beginner',
        levelLabel: '초급',
        title: 'AI가 잘하는 일',
        objective: 'AI가 도움을 줄 수 있는 대표적인 일을 알아봅니다.',
        content: 'AI는 글 요약, 아이디어 제안, 번역처럼 많은 정보를 빠르게 처리하는 일을 잘합니다.',
        example: '긴 안내문을 짧고 쉬운 문장으로 정리해 달라고 요청할 수 있습니다.',
        quiz: {
          question: 'AI에게 도움을 요청하기 적절한 일은 무엇인가요?',
          options: ['긴 글 요약하기', '약을 직접 처방하기', '통장 비밀번호 결정하기'],
          answerIndex: 0,
          explanation: '긴 글 요약은 AI가 잘 도울 수 있지만 의료 결정이나 비밀번호 관리는 사람이 직접 해야 합니다.'
        }
      },
      {
        id: 'beginner-3',
        level: 'beginner',
        levelLabel: '초급',
        title: 'AI를 안전하게 사용하는 법',
        objective: '개인정보를 보호하고 AI 답변을 확인하는 습관을 배웁니다.',
        content: 'AI에는 주민등록번호, 계좌번호, 비밀번호 같은 중요한 개인정보를 입력하지 않아야 합니다.',
        example: '건강이나 금융 정보는 AI 답변만 믿지 말고 전문가나 공식 기관에 다시 확인합니다.',
        quiz: {
          question: 'AI에게 입력하면 안 되는 정보는 무엇인가요?',
          options: ['좋아하는 음식', '통장 비밀번호', '오늘의 날씨 질문'],
          answerIndex: 1,
          explanation: '통장 비밀번호와 같은 개인정보는 AI를 포함한 다른 사람에게 알려주면 안 됩니다.'
        }
      },
      {
        id: 'intermediate-1',
        level: 'intermediate',
        levelLabel: '중급',
        title: 'AI로 정보 찾기',
        objective: '필요한 조건을 포함해 AI에게 정보를 요청하는 방법을 배웁니다.',
        content: '무엇을, 누구를 위해, 어떤 형식으로 찾는지 함께 말하면 더 알맞은 답변을 받을 수 있습니다.',
        example: '서울에서 어르신이 걷기 편한 무료 공원 3곳을 표로 알려 달라고 요청합니다.',
        quiz: {
          question: '더 구체적인 AI 요청은 무엇인가요?',
          options: ['공원 알려줘', '서울의 걷기 편한 무료 공원 3곳을 표로 알려줘', '좋은 곳 알려줘'],
          answerIndex: 1,
          explanation: '지역, 조건, 개수, 답변 형식이 포함된 요청이 더 구체적입니다.'

      },
      {
        id: 'intermediate-2',
        level: 'intermediate',
        levelLabel: '중급',
        title: 'AI로 글 작성하기',

        content: '받는 사람, 글의 목적, 원하는 말투를 알려주면 상황에 맞는 글을 만들 수 있습니다.',
        example: '복지관 모임에 참석하지 못한다는 문자를 정중한 말투로 작성해 달라고 요청합니다.',
        quiz: {
          question: '문자 작성을 요청할 때 알려주면 좋은 정보는 무엇인가요?',
          options: ['받는 사람과 목적', '휴대전화 비밀번호', '주민등록번호'],
          answerIndex: 0,
          explanation: '받는 사람과 목적을 알려주면 상황에 맞는 문장을 받을 수 있습니다.'
        }
      },
      {
        id: 'intermediate-3',
        level: 'intermediate',
        levelLabel: '중급',
        title: 'AI 답변 다시 요청하기',
        objective: '마음에 들지 않는 답변을 원하는 방향으로 고쳐 달라고 요청합니다.',
        content: '첫 답변이 어렵거나 길다면 더 쉽게, 더 짧게, 또는 예시를 넣어 달라고 다시 요청할 수 있습니다.',
        example: '방금 설명을 초등학생도 이해할 수 있는 말로 세 문장 안에 다시 설명해 달라고 요청합니다.',
        quiz: {
          question: 'AI 답변이 너무 어려울 때 적절한 요청은 무엇인가요?',
          options: ['그대로 사용한다', '더 쉬운 말과 예시로 다시 설명해 달라고 한다', '개인정보를 추가한다'],
          answerIndex: 1,
          explanation: '원하는 난이도와 형식을 구체적으로 말하면 답변을 개선할 수 있습니다.'
        }
      },
      {
        id: 'advanced-1',
        level: 'advanced',
        levelLabel: '고급',
        title: '좋은 프롬프트 구성하기',
        objective: '역할, 목적, 조건, 출력 형식을 포함한 요청을 작성합니다.',
        content: '좋은 프롬프트에는 AI가 맡을 역할, 해야 할 일, 지켜야 할 조건, 답변 형식이 들어갑니다.',
        example: '여행 안내자 역할로 부산 1일 여행 일정을 이동이 적은 순서의 표로 작성해 달라고 요청합니다.',
        quiz: {
          question: '좋은 프롬프트의 구성 요소가 아닌 것은 무엇인가요?',
          options: ['요청 목적', '원하는 답변 형식', '통장 비밀번호'],
          answerIndex: 2,
          explanation: '개인정보는 프롬프트 구성 요소가 아니며 AI에 입력해서도 안 됩니다.'
        }
      },
      {
        id: 'advanced-2',
        level: 'advanced',
        levelLabel: '고급',
        title: 'AI 답변 비교하고 개선하기',
        objective: '여러 답변을 비교하고 부족한 점을 보완하도록 요청합니다.',
        content: '같은 질문도 조건을 바꾸어 다시 물어보고 어떤 답변이 목적에 더 맞는지 비교할 수 있습니다.',
        example: '같은 안내문을 친근한 말투와 공식적인 말투로 각각 작성한 뒤 상황에 맞는 것을 선택합니다.',
        quiz: {
          question: 'AI 답변을 개선하는 좋은 방법은 무엇인가요?',
          options: ['첫 답변을 항상 정답으로 생각한다', '조건을 바꾸어 다시 요청하고 결과를 비교한다', '출처 확인을 생략한다'],
          answerIndex: 1,
          explanation: '조건을 조정한 여러 답변을 비교하면 목적에 더 맞는 결과를 선택할 수 있습니다.'
        }
      },
      {
        id: 'advanced-3',
        level: 'advanced',
        levelLabel: '고급',
        title: 'AI 정보 확인하기',
        objective: 'AI 답변의 사실 여부를 공식 자료와 비교해 확인합니다.',
        content: 'AI는 사실과 다른 답변을 만들 수 있으므로 중요한 정보는 공식 기관이나 믿을 수 있는 자료에서 확인해야 합니다.',
        example: '정부 지원 제도는 AI 답변에 나온 기관명과 조건을 정부 공식 홈페이지에서 다시 확인합니다.',
        quiz: {
          question: '중요한 AI 답변을 받은 뒤 해야 할 일은 무엇인가요?',
          options: ['바로 다른 사람에게 전달한다', '공식 기관이나 믿을 수 있는 자료에서 확인한다', '항상 사실이라고 생각한다'],
          answerIndex: 1,
          explanation: '중요한 정보는 공식 자료와 비교해야 잘못된 정보로 인한 피해를 예방할 수 있습니다.'
        }
      }
    ]);

    const LEVELS = Object.freeze({
      beginner: {
        label: '🌱 초급',
        description: 'AI의 뜻과 기본 기능을 알아보고, 개인정보를 지키며 안전하게 사용하는 방법을 배웁니다.'
      },
      intermediate: {
        label: '🌿 중급',
        description: '정보 검색과 글쓰기에 AI를 활용하고, 원하는 답변을 얻도록 다시 요청하는 방법을 배웁니다.'
      },
      advanced: {
        label: '🌳 고급',
        description: '구체적인 프롬프트를 만들고, AI 답변을 비교하며 중요한 정보를 검증하는 방법을 배웁니다.'
      }
    });

    const state = {
      selectedLevel: 'beginner'
    };

    const levelTabs = Array.from(document.querySelectorAll('[role="tab"]'));
    const levelPanel = document.getElementById('level-panel');
    const selectedLevelTitle = document.getElementById('selected-level-title');
    const selectedLevelDescription = document.getElementById('selected-level-description');
    const selectedLevelCount = document.getElementById('selected-level-count');
    const lessonPreviewList = document.getElementById('lesson-preview-list');

    function getLessonsByLevel(level) {
      return LESSONS.filter(lesson => lesson.level === level);
    }

    function renderSelectedLevel() {
      const level = LEVELS[state.selectedLevel];
      const lessons = getLessonsByLevel(state.selectedLevel);
      const activeTab = document.getElementById(`level-tab-${state.selectedLevel}`);

      selectedLevelTitle.textContent = level.label;
      selectedLevelDescription.textContent = level.description;
      selectedLevelCount.textContent = `${lessons.length}개 레슨`;
      levelPanel.setAttribute('aria-labelledby', activeTab.id);

      lessonPreviewList.replaceChildren();

      lessons.forEach((lesson, index) => {
        const item = document.createElement('li');
        item.className = 'lesson-preview';

        const number = document.createElement('span');
        number.className = 'lesson-preview__number';
        number.textContent = `레슨 ${index + 1}`;

        const title = document.createElement('h3');
        title.className = 'lesson-preview__title';
        title.textContent = lesson.title;

        const objective = document.createElement('p');
        objective.className = 'lesson-preview__objective';
        objective.textContent = lesson.objective;

        item.append(number, title, objective);
        lessonPreviewList.append(item);
      });
    }

    function selectLevel(level, moveFocus = false) {
      if (!Object.hasOwn(LEVELS, level)) return;

      state.selectedLevel = level;

      levelTabs.forEach(tab => {
        const isSelected = tab.dataset.level === level;
        tab.setAttribute('aria-selected', String(isSelected));
        tab.tabIndex = isSelected ? 0 : -1;
        tab.classList.toggle('btn-primary', isSelected);
        tab.classList.toggle('btn-secondary', !isSelected);
      });

      renderSelectedLevel();

      if (moveFocus) {
        document.getElementById(`level-tab-${level}`).focus();
      }
    }

    function moveTabFocus(currentIndex, direction) {
      const nextIndex = (currentIndex + direction + levelTabs.length) % levelTabs.length;
      selectLevel(levelTabs[nextIndex].dataset.level, true);
    }

    levelTabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectLevel(tab.dataset.level));
      tab.addEventListener('keydown', event => {
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
          event.preventDefault();
          moveTabFocus(index, 1);
        }

        if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
          event.preventDefault();
          moveTabFocus(index, -1);
        }

        if (event.key === 'Home') {
          event.preventDefault();
          selectLevel(levelTabs[0].dataset.level, true);
        }

        if (event.key === 'End') {
          event.preventDefault();
          selectLevel(levelTabs[levelTabs.length - 1].dataset.level, true);
        }
      });
    });

    renderSelectedLevel();
  </script>
</body>
</html>
