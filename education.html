<body>
  <div id="nav-container"></div>
  <main>
    <div class="container">
      <div class="page-header">
        <h1>📚 단계별 AI 교육</h1>
        <p>초급부터 고급까지 단계별로 AI를 배울 수 있습니다.</p>

      <!--
        =====================================================
        팀원 C: 여기서부터 콘텐츠를 구현하세요.

        담당 기능: 단계별 AI 기초 교육
        브랜치: feature/education
        localStorage prefix: ailv:education:
          - ailv:education:completed → [ "초급-1", "초급-2", ... ]

        구현 항목:
          1. 초급 / 중급 / 고급 3단계, 각 단계 최소 3개 레슨
          2. 레슨 구성: 텍스트 설명 + 이미지/예시 + 간단 확인 퀴즈
          3. 레슨 완료 시 체크 표시 및 localStorage 저장
          4. 단계 간 자유 이동 (잠금 없음)
          5. 완료 저장: Utils.saveData('ailv:education:completed', [...])
        =====================================================
      -->

      <div class="card">
        <p style="color:var(--color-text-muted); text-align:center; padding:3rem 0; font-size:var(--font-size-lg);">
          🚧 팀원 C가 개발 중입니다.
        </p>
