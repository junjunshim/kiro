<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단계별 AI 교육 - AI 배움터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/style.css">
  <style>
    /* =====================================================
       팀원 C 담당 - 단계별 AI 교육 전용 스타일
       shared/style.css의 공통 변수와 클래스를 사용합니다.
       ===================================================== */
    .education-overview {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .education-overview__title {
      font-size: var(--font-size-lg);
    }

    .education-overview__description {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .progress-summary {
      display: grid;
      gap: 1rem;
    }

    .progress-summary__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .progress-summary__value {
      color: var(--color-primary-dark);
      font-size: var(--font-size-xl);
      font-weight: 700;
      white-space: nowrap;
    }

    .progress-summary__status {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .level-section {
      display: grid;
      gap: 1rem;
    }

    .level-section__title {
      font-size: var(--font-size-lg);
    }

    .level-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .level-tab {
      width: 100%;
      flex-direction: column;
      gap: 0.25rem;
      border: 2px solid transparent;
    }

    .level-tab[aria-selected="true"] {
      border-color: var(--color-primary-dark);
    }

    .level-tab__name {
      font-size: var(--font-size-lg);
    }

    .level-tab__summary {
      font-size: var(--font-size-sm);
      font-weight: 400;
    }

    .level-panel {
      display: grid;
      gap: 1rem;
      border: 2px solid var(--color-primary);
    }

    .level-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .level-panel__title {
      font-size: var(--font-size-xl);
    }

    .level-panel__description {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .lesson-preview-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      list-style: none;
    }

    .lesson-preview {
      display: grid;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-bg);
      overflow: hidden;
    }

    .lesson-preview[data-selected="true"] {
      border-color: var(--color-primary);
      box-shadow: var(--shadow);
    }

    .lesson-select-button {
      width: 100%;
      min-height: var(--touch-target);
      align-items: flex-start;
      justify-content: flex-start;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1rem;
      text-align: left;
      border-radius: 0;
    }

    .lesson-preview__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .lesson-preview__number {
      color: var(--color-primary-dark);
      font-size: var(--font-size-sm);
      font-weight: 700;
    }

    .lesson-preview__title {
      font-size: var(--font-size-lg);
    }

    .lesson-preview__objective {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
      font-weight: 400;
    }

    .lesson-detail {
      display: grid;
      gap: 1.5rem;
      margin-top: 1rem;
      border-top: 2px solid var(--color-border);
      padding-top: 1.5rem;
    }

    .lesson-detail__header {
      display: grid;
      gap: 0.5rem;
    }

    .lesson-detail__eyebrow {
      color: var(--color-primary-dark);
      font-size: var(--font-size-sm);
      font-weight: 700;
    }

    .lesson-detail__title {
      font-size: var(--font-size-xl);
    }

    .lesson-detail__objective {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
    }

    .lesson-content-section {
      display: grid;
      gap: 0.5rem;
    }

    .lesson-content-section h4 {
      font-size: var(--font-size-lg);
    }

    .lesson-content-section p {
      font-size: var(--font-size-md);
    }

    .lesson-example {
      padding: 1rem;
      border-left: 4px solid var(--color-secondary);
      border-radius: var(--radius);
      background: var(--color-bg);
    }

    .lesson-navigation {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .lesson-navigation .btn:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .lesson-navigation__status {
      color: var(--color-text-muted);
      font-size: var(--font-size-md);
      text-align: center;
    }

    @media (max-width: 600px) {
      .level-tabs,
      .lesson-preview-list {
        grid-template-columns: 1fr;
      }

      .level-tab {
        align-items: flex-start;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div id="nav-container"></div>
  <main>
    <div class="container">
      <div class="page-header">
        <h1>📚 단계별 AI 교육</h1>
        <p>초급부터 고급까지 단계별로 AI를 배울 수 있습니다.</p>
      </div>

      <section class="card education-overview progress-summary" aria-labelledby="education-overview-title">
        <div class="progress-summary__header">
          <div>
            <h2 class="education-overview__title" id="education-overview-title">전체 학습 진행률</h2>
            <p class="education-overview__description">완료한 레슨 수를 기준으로 전체 학습 진행 상황을 보여줍니다.</p>
          </div>
          <strong class="progress-summary__value" id="overall-progress-text">0 / 9</strong>
        </div>
        <div
          class="progress-bar"
          id="overall-progress-bar"
          role="progressbar"
          aria-label="전체 AI 교육 학습 진행률"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-valuetext="전체 9개 중 0개 완료"
        >
          <div class="progress-bar__fill" id="overall-progress-fill"></div>
        </div>
        <p class="progress-summary__status" id="overall-progress-status" aria-live="polite"></p>
      </section>

      <section class="level-section" aria-labelledby="level-section-title">
        <h2 class="level-section__title" id="level-section-title">학습 단계 선택</h2>

        <div
          class="level-tabs"
          id="level-tabs"
          role="tablist"
          aria-label="AI 교육 학습 단계"
        ></div>

        <div
          class="card level-panel"
          id="level-panel"
          role="tabpanel"
          aria-labelledby="level-section-title"
          tabindex="0"
        >
          <div class="level-panel__header">
            <h2 class="level-panel__title" id="selected-level-title"></h2>
            <span class="badge badge-blue" id="selected-level-count"></span>
          </div>
          <p class="level-panel__description" id="selected-level-description"></p>
          <ol class="lesson-preview-list" id="lesson-preview-list" aria-label="선택한 단계의 레슨"></ol>

          <article class="lesson-detail" id="lesson-detail" aria-labelledby="lesson-detail-title" aria-live="polite">
            <header class="lesson-detail__header">
              <span class="lesson-detail__eyebrow" id="lesson-detail-position"></span>
              <h3 class="lesson-detail__title" id="lesson-detail-title" tabindex="-1"></h3>
              <p class="lesson-detail__objective" id="lesson-detail-objective"></p>
            </header>

            <section class="lesson-content-section" aria-labelledby="lesson-content-title">
              <h4 id="lesson-content-title">배울 내용</h4>
              <p id="lesson-detail-content"></p>
            </section>

            <section class="lesson-content-section lesson-example" aria-labelledby="lesson-example-title">
              <h4 id="lesson-example-title">쉬운 예시</h4>
              <p id="lesson-detail-example"></p>
            </section>

            <nav class="lesson-navigation" aria-label="레슨 이동">
              <button class="btn btn-secondary" id="previous-lesson-button" type="button">← 이전 레슨</button>
              <button class="btn btn-primary" id="next-lesson-button" type="button">다음 레슨 →</button>
            </nav>
            <p class="lesson-navigation__status" id="lesson-navigation-status" aria-live="polite"></p>
          </article>
        </div>
      </section>
    </div>
  </main>

  <script src="shared/utils.js"></script>
  <script src="shared/nav.js"></script>

        icon: '🌿',
        summary: 'AI를 생활에 활용할 분',
        description: '정보 검색과 글쓰기에 AI를 활용하고, 원하는 답변을 얻도록 다시 요청하는 방법을 배웁니다.'
      },
      {
        id: 'advanced',
        label: '고급',
        icon: '🌳',
        summary: 'AI를 더 정확하게 쓸 분',
        description: '구체적인 프롬프트를 만들고, AI 답변을 비교하며 중요한 정보를 검증하는 방법을 배웁니다.'
      }
    ]);

    const state = {
      selectedLevel: 'beginner',
      selectedLessonId: 'beginner-1',
      completedLessonIds: []
    };

    const levelTabsContainer = document.getElementById('level-tabs');
    const levelPanel = document.getElementById('level-panel');
    const selectedLevelTitle = document.getElementById('selected-level-title');
    const selectedLevelDescription = document.getElementById('selected-level-description');
    const selectedLevelCount = document.getElementById('selected-level-count');
    const lessonPreviewList = document.getElementById('lesson-preview-list');
    const lessonDetailTitle = document.getElementById('lesson-detail-title');
    const lessonDetailPosition = document.getElementById('lesson-detail-position');
    const lessonDetailObjective = document.getElementById('lesson-detail-objective');
    const lessonDetailContent = document.getElementById('lesson-detail-content');
    const lessonDetailExample = document.getElementById('lesson-detail-example');
    const previousLessonButton = document.getElementById('previous-lesson-button');
    const nextLessonButton = document.getElementById('next-lesson-button');
    const lessonNavigationStatus = document.getElementById('lesson-navigation-status');
    const overallProgressText = document.getElementById('overall-progress-text');
    const overallProgressBar = document.getElementById('overall-progress-bar');
    const overallProgressFill = document.getElementById('overall-progress-fill');
    const overallProgressStatus = document.getElementById('overall-progress-status');

    function getLevelById(levelId) {
      return LEVELS.find(level => level.id === levelId) || null;
    }

    function getLessonsByLevel(levelId) {
      return LESSONS.filter(lesson => lesson.level === levelId);
    }

    function getLessonById(lessonId) {
      return LESSONS.find(lesson => lesson.id === lessonId) || null;
    }

    function getValidCompletedLessonIds(completedLessonIds) {
      if (!Array.isArray(completedLessonIds)) return [];

      const validLessonIds = new Set(LESSONS.map(lesson => lesson.id));
      return [...new Set(completedLessonIds)].filter(lessonId => validLessonIds.has(lessonId));
    }

    function calculateProgress(completedLessonIds) {
      const completed = getValidCompletedLessonIds(completedLessonIds).length;
      const total = LESSONS.length;
      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

      return { completed, total, percentage };
    }

    function createLevelTab(level) {
      const isSelected = level.id === state.selectedLevel;
      const button = document.createElement('button');
      button.className = `btn ${isSelected ? 'btn-primary' : 'btn-secondary'} level-tab`;
      button.id = `level-tab-${level.id}`;
      button.type = 'button';
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-selected', String(isSelected));
      button.setAttribute('aria-controls', 'level-panel');
      button.dataset.level = level.id;
      button.tabIndex = isSelected ? 0 : -1;

      const name = document.createElement('span');
      name.className = 'level-tab__name';
      name.textContent = `${level.icon} ${level.label}`;

      const summary = document.createElement('span');
      summary.className = 'level-tab__summary';
      summary.textContent = level.summary;

      button.append(name, summary);
      return button;
    }

    function renderLevelTabs() {
      const tabs = LEVELS.map(createLevelTab);
      levelTabsContainer.replaceChildren(...tabs);
    }

    function createLessonPreview(lesson, index) {
      const isSelected = lesson.id === state.selectedLessonId;
      const item = document.createElement('li');
      item.className = 'lesson-preview';
      item.dataset.lessonId = lesson.id;
      item.dataset.selected = String(isSelected);

      const button = document.createElement('button');
      button.className = 'btn btn-secondary lesson-select-button';
      button.id = `lesson-button-${lesson.id}`;
      button.type = 'button';
      button.dataset.lessonId = lesson.id;
      if (isSelected) button.setAttribute('aria-current', 'step');

      const header = document.createElement('span');
      header.className = 'lesson-preview__header';

      const number = document.createElement('span');
      number.className = 'lesson-preview__number';
      number.textContent = `레슨 ${index + 1}`;
      header.append(number);

      if (isSelected) {
        const status = document.createElement('span');
        status.className = 'badge badge-blue';
        status.textContent = '현재 학습';
        header.append(status);
      }

      const title = document.createElement('span');
      title.className = 'lesson-preview__title';
      title.textContent = lesson.title;

      const objective = document.createElement('span');
      objective.className = 'lesson-preview__objective';
      objective.textContent = lesson.objective;

      button.append(header, title, objective);
      item.append(button);
      return item;
    }

    function renderLessonList(levelId) {
      const lessons = getLessonsByLevel(levelId);
      const lessonItems = lessons.map(createLessonPreview);
      lessonPreviewList.replaceChildren(...lessonItems);
      return lessons;
    }

    function updateLessonNavigation(lesson, lessons) {
      const currentIndex = lessons.findIndex(item => item.id === lesson.id);
      const levelIndex = LEVELS.findIndex(level => level.id === lesson.level);
      const nextLevel = LEVELS[levelIndex + 1] || null;
      const isFirstLesson = currentIndex === 0;
      const isLastLesson = currentIndex === lessons.length - 1;

      previousLessonButton.disabled = isFirstLesson;
      previousLessonButton.setAttribute(
        'aria-label',
        isFirstLesson ? '이 단계의 첫 번째 레슨입니다' : '이전 레슨으로 이동'
      );

      if (!isLastLesson) {
        nextLessonButton.disabled = false;
        nextLessonButton.textContent = '다음 레슨 →';
        nextLessonButton.setAttribute('aria-label', '다음 레슨으로 이동');
        lessonNavigationStatus.textContent = `${currentIndex + 1} / ${lessons.length}번째 레슨입니다.`;
        return;
      }

      if (nextLevel) {
        nextLessonButton.disabled = false;
        nextLessonButton.textContent = `${nextLevel.icon} ${nextLevel.label} 단계로 이동`;
        nextLessonButton.setAttribute('aria-label', `${nextLevel.label} 단계의 첫 번째 레슨으로 이동`);
        lessonNavigationStatus.textContent = `이 레슨 다음에는 ${nextLevel.label} 단계로 이동합니다.`;
        return;
      }

      nextLessonButton.disabled = true;
      nextLessonButton.textContent = '마지막 레슨입니다';
      nextLessonButton.setAttribute('aria-label', '전체 교육 과정의 마지막 레슨입니다');
      lessonNavigationStatus.textContent = '전체 교육 과정의 마지막 레슨입니다.';
    }

    function renderLessonDetail(lessons) {
      const lesson = getLessonById(state.selectedLessonId);
      if (!lesson || lesson.level !== state.selectedLevel) return;

      const currentIndex = lessons.findIndex(item => item.id === lesson.id);
      const level = getLevelById(lesson.level);

      lessonDetailPosition.textContent = `${level.label} · 레슨 ${currentIndex + 1} / ${lessons.length}`;
      lessonDetailTitle.textContent = lesson.title;
      lessonDetailObjective.textContent = `학습 목표: ${lesson.objective}`;
      lessonDetailContent.textContent = lesson.content;
      lessonDetailExample.textContent = lesson.example;
      updateLessonNavigation(lesson, lessons);
    }

    function renderSelectedLevel() {
      const level = getLevelById(state.selectedLevel);
      if (!level) return;

      const lessons = getLessonsByLevel(level.id);
      if (!lessons.some(lesson => lesson.id === state.selectedLessonId)) {
        state.selectedLessonId = lessons[0]?.id || null;
      }

      const renderedLessons = renderLessonList(level.id);
      const activeTab = document.getElementById(`level-tab-${level.id}`);

      selectedLevelTitle.textContent = `${level.icon} ${level.label}`;
      selectedLevelDescription.textContent = level.description;
      selectedLevelCount.textContent = `${renderedLessons.length}개 레슨`;
      levelPanel.setAttribute('aria-labelledby', activeTab.id);
      renderLessonDetail(renderedLessons);
    }

    function renderProgress() {
      const progress = calculateProgress(state.completedLessonIds);
      const statusMessage = progress.completed === 0
        ? '아직 완료한 레슨이 없습니다. 원하는 단계부터 천천히 시작해 보세요.'
        : `전체 ${progress.total}개 레슨 중 ${progress.completed}개를 완료했습니다.`;

      overallProgressText.textContent = `${progress.completed} / ${progress.total}`;
      overallProgressFill.style.width = `${progress.percentage}%`;
      overallProgressBar.setAttribute('aria-valuenow', String(progress.percentage));
      overallProgressBar.setAttribute(
        'aria-valuetext',
        `전체 ${progress.total}개 중 ${progress.completed}개 완료`
      );
      overallProgressStatus.textContent = statusMessage;
    }

    function render() {
      renderLevelTabs();
      renderSelectedLevel();
      renderProgress();
    }

    function selectLevel(levelId, moveFocus = false) {
      const level = getLevelById(levelId);
      if (!level) return;

      const firstLesson = getLessonsByLevel(level.id)[0];
      state.selectedLevel = level.id;
      state.selectedLessonId = firstLesson?.id || null;
      renderLevelTabs();
      renderSelectedLevel();

      if (moveFocus) {
        document.getElementById(`level-tab-${level.id}`).focus();
      }
    }

    function selectLesson(lessonId, moveFocus = false) {
      const lesson = getLessonById(lessonId);
      if (!lesson || lesson.level !== state.selectedLevel) return;

      state.selectedLessonId = lesson.id;
      const lessons = renderLessonList(state.selectedLevel);
      renderLessonDetail(lessons);

      if (moveFocus) {
        document.getElementById(`lesson-button-${lesson.id}`).focus();
      }
    }

    function moveToPreviousLesson() {
      const lessons = getLessonsByLevel(state.selectedLevel);
      const currentIndex = lessons.findIndex(lesson => lesson.id === state.selectedLessonId);
      if (currentIndex <= 0) return;

      selectLesson(lessons[currentIndex - 1].id);
    }

    function moveToNextLesson() {
      const lessons = getLessonsByLevel(state.selectedLevel);
      const currentIndex = lessons.findIndex(lesson => lesson.id === state.selectedLessonId);
      if (currentIndex < 0) return;

      if (currentIndex < lessons.length - 1) {
        selectLesson(lessons[currentIndex + 1].id);
        return;
      }

      const currentLevelIndex = LEVELS.findIndex(level => level.id === state.selectedLevel);
      const nextLevel = LEVELS[currentLevelIndex + 1];
      if (nextLevel) selectLevel(nextLevel.id);
    }

    function getClosestElement(target, selector) {
      if (!target || typeof target.closest !== 'function') return null;
      return target.closest(selector);
    }

    levelTabsContainer.addEventListener('click', event => {
      const tab = getClosestElement(event.target, '[role="tab"]');
      if (!tab || !levelTabsContainer.contains(tab)) return;
      selectLevel(tab.dataset.level, true);
    });

    levelTabsContainer.addEventListener('keydown', event => {
      const tab = getClosestElement(event.target, '[role="tab"]');
      if (!tab || !levelTabsContainer.contains(tab)) return;

      const currentIndex = LEVELS.findIndex(level => level.id === tab.dataset.level);
      let nextIndex = currentIndex;

      if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
        nextIndex = (currentIndex + 1) % LEVELS.length;
      } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
        nextIndex = (currentIndex - 1 + LEVELS.length) % LEVELS.length;
      } else if (event.key === 'Home') {
        nextIndex = 0;
      } else if (event.key === 'End') {
        nextIndex = LEVELS.length - 1;
      } else {
        return;
      }

      event.preventDefault();
      selectLevel(LEVELS[nextIndex].id, true);
    });

    lessonPreviewList.addEventListener('click', event => {
      const button = getClosestElement(event.target, '[data-lesson-id]');
      if (!button || !lessonPreviewList.contains(button)) return;
      selectLesson(button.dataset.lessonId, true);
    });

    previousLessonButton.addEventListener('click', moveToPreviousLesson);
    nextLessonButton.addEventListener('click', moveToNextLesson);

    render();
  </script>
</body>
</html>
