        testAssert.equal(calls[0].options.body.stream, false, 'stream false가 payload에 없습니다.');
        testAssert.equal(controllerCount, 1, '요청마다 AbortController를 만들지 않았습니다.');
        testAssert.equal(timers[0].delay, OLLAMA_TIMEOUT_MS, 'timeout 시간이 10초가 아닙니다.');
        testAssert.equal(timers[0].cleared, true, '성공 후 timeout timer가 정리되지 않았습니다.');
      });

      selfTests.test('mock 네트워크·HTTP·malformed·빈 응답과 timeout은 오류 코드와 timer 정리를 보장한다', async ({ assert: testAssert }) => {
        const outcomes = [
          { code: 'CONNECTION_FAILED', fetch: async () => { throw new TypeError('connection refused'); } },
          { code: 'HTTP_FAILED', fetch: async () => ({ ok: false, async json() { return {}; } }) },
          { code: 'INVALID_RESPONSE', fetch: async () => ({ ok: true, async json() { return '{malformed'; } }) },
          { code: 'EMPTY_RESPONSE', fetch: async () => ({ ok: true, async json() { return { message: { content: '  ' } }; } }) }
        ];
        for (const outcome of outcomes) {
          let cleared = false;
          const result = await requestOllamaChat({
            modelId: 'fixed-test-model',
            messages: [{ role: 'user', content: '오류 질문' }],
            fetchImpl: outcome.fetch,
            abortControllerImpl: class { constructor() { this.signal = { aborted: false }; } abort() { this.signal.aborted = true; } },
            setTimeoutImpl: () => 1,
            clearTimeoutImpl: () => { cleared = true; }
          });
          testAssert.equal(result.code, outcome.code, `${outcome.code}가 올바르게 분류되지 않았습니다.`);
          testAssert(cleared, `${outcome.code} 후 timeout timer가 정리되지 않았습니다.`);
        }

        let timeoutCallback;
        const timeoutController = { current: null };
        const timeoutResult = await requestOllamaChat({
          modelId: 'fixed-test-model',
          messages: [{ role: 'user', content: 'timeout 질문' }],
          fetchImpl: async (url, options) => {
            timeoutController.current = options.signal;
            if (options.signal.aborted) {
              throw new Error('aborted');
            }
            return new Promise((resolve, reject) => {
              timeoutController.reject = reject;
            });
          },
          abortControllerImpl: class { constructor() { this.signal = { aborted: false }; } abort() { this.signal.aborted = true; timeoutController.reject(new Error('aborted')); } },
          setTimeoutImpl: (callback) => {
            timeoutCallback = callback;
            queueMicrotask(callback);
            return 9;
          },
          clearTimeoutImpl: (id) => testAssert.equal(id, 9, 'timeout timer ID가 보존되지 않았습니다.')
        });
        testAssert.equal(timeoutController.current.aborted, true, 'timeout 시 AbortController가 중단되지 않았습니다.');
        const finalTimeoutResult = timeoutResult;
        testAssert.equal(finalTimeoutResult.code, 'TIMEOUT', 'timeout이 TIMEOUT으로 분류되지 않았습니다.');
      });

      selfTests.test('mock fetch로 실패 후 Retry가 동일 snapshot을 한 번만 성공시킨다', async ({ assert: testAssert }) => {
        const requests = [];
        let attempt = 0;
        const mockFetch = async (url, options) => {
          requests.push({ url, body: JSON.parse(options.body) });
          attempt += 1;
          if (attempt === 1) {
            throw new TypeError('offline');
          }
          return { ok: true, async json() { return { message: { content: 'retry response' } }; } };
        };
        const mockAdapterOptions = {
          fetchImpl: mockFetch,
          abortControllerImpl: class { constructor() { this.signal = { aborted: false }; } abort() { this.signal.aborted = true; } },
          setTimeoutImpl: () => 1,
          clearTimeoutImpl: () => {}
        };
        const initial = startScenario(createAppState([], null, 'fixed-test-model'), 'information-search');
        const started = beginMessageRequest(initial, '같은 요청을 재시도합니다.', 'fixed-test-model');
        const firstResult = await requestOllamaChat({ ...mockAdapterOptions, modelId: started.snapshot.modelId, messages: started.snapshot.messages, requestSnapshot: started.snapshot });
        const failed = finishInitialRequest(started.state, started.snapshot, firstResult);
        testAssert.equal(failed.failedRequest.code, 'CONNECTION_FAILED', '첫 실패가 연결 오류로 저장되지 않았습니다.');
        const retry = beginRetryRequest(failed);
        const secondResult = await requestOllamaChat({ ...mockAdapterOptions, modelId: retry.snapshot.modelId, messages: retry.snapshot.messages, requestSnapshot: retry.snapshot });
        const succeeded = finishRetryRequest(retry.state, retry.snapshot, secondResult);
        testAssert.equal(succeeded.turnCount, 1, 'Retry 성공이 정확히 한 Turn을 추가하지 않았습니다.');
        testAssert.equal(requests.length, 2, '최초 요청과 Retry 외 요청이 발생했습니다.');
        testAssert.deepEqual(requests[0].body, requests[1].body, 'Retry payload가 최초 snapshot과 달라졌습니다.');
        testAssert.equal(beginRetryRequest(succeeded).code, 'RETRY_EXHAUSTED', '성공 후 불필요한 Retry가 허용되었습니다.');
      });

      selfTests.test('mock Utils와 storage로 완료 복원·손상값·저장 실패를 외부 저장소 없이 검증한다', ({ assert: testAssert }) => {
        const stored = ['smart-shopping'];
        const storageCalls = [];
        const mockStorage = { getItem(key) { storageCalls.push(['getItem', key]); return JSON.stringify(stored); } };
        const mockUtils = {
          loadData(key) { storageCalls.push(['loadData', key]); return [...stored]; },
          saveData(key, value) { storageCalls.push(['saveData', key]); stored.splice(0, stored.length, ...value); }
        };
        const repository = createCompletionRepository({ utilsApi: mockUtils, storage: mockStorage });
        testAssert.deepEqual(repository.load(), { ok: true, value: ['smart-shopping'] }, 'mock 저장값 복원이 실패했습니다.');
        testAssert.deepEqual(repository.save(['smart-shopping', 'information-search']), { ok: true }, 'mock 완료 저장이 실패했습니다.');
        testAssert(storageCalls.every(([, key]) => key === COMPLETION_KEY), '완료 키 외의 저장소 키가 사용되었습니다.');

        const invalidRepository = createCompletionRepository({
          utilsApi: { loadData: () => ['unknown-scenario'], saveData: () => { throw new Error('write forbidden'); } },
          storage: { getItem: () => 'invalid' }
        });
        testAssert.deepEqual(invalidRepository.load(), { ok: false, value: [], code: 'INVALID_STORED_VALUE' }, '손상된 완료값이 거부되지 않았습니다.');

        const failedSaveRepository = createCompletionRepository({
          utilsApi: { saveData: () => {}, loadData: () => ['different-id'] },
          storage: mockStorage
        });
        testAssert.deepEqual(failedSaveRepository.save(['smart-shopping']), { ok: false, code: 'SAVE_FAILED' }, '저장 검증 불일치가 SAVE_FAILED가 아닙니다.');
      });

      selfTests.test('전체 흐름은 선택·모델 입력·세 번의 동적 응답·완료와 복원을 연결한다', async ({ assert: testAssert, document: documentRef }) => {
        const calls = [];
        const storageCalls = [];
        let storedValue = null;
        const flowStorage = {
          getItem(key) {
            storageCalls.push({ type: 'getItem', key });
            return storedValue === null ? null : JSON.stringify(storedValue);
          }
        };
        const flowUtils = {
          loadData(key, fallback) {
            storageCalls.push({ type: 'loadData', key });
            return storedValue === null
              ? (Array.isArray(fallback) ? [] : fallback)
              : [...storedValue];
          },
          saveData(key, value) {
            storageCalls.push({ type: 'saveData', key, value: [...value] });
            storedValue = [...value];
          }
        };
        const repository = createCompletionRepository({
          utilsApi: flowUtils,
          storage: flowStorage
        });
        const initialState = createAppState(repository.load().value, null, '');
        simulationAppState = initialState;
        renderCatalog(initialState);

        const selectedButton = documentRef.querySelector('[data-action="select-scenario"][data-scenario-id="information-search"]');
        testAssert(selectedButton, '정보 검색 시나리오 선택 버튼이 없습니다.');
        handleCatalogSelection('information-search');
        testAssert.equal(simulationAppState.view, APP_VIEW.CHAT, '시나리오 선택 후 채팅 화면이 열리지 않았습니다.');
        testAssert.equal(simulationAppState.selectedScenarioId, 'information-search', '선택한 시나리오 ID가 보존되지 않았습니다.');

        renderChat(simulationAppState);
        const modelInput = documentRef.getElementById('simulation-model');
        modelInput.value = 'configured-local-model';
        modelInput.dispatchEvent(new Event('input', { bubbles: true }));
        testAssert.equal(simulationAppState.modelId, 'configured-local-model', '모델 입력값이 현재 상태에 반영되지 않았습니다.');

        const mockFetch = async (url, options) => {
          const body = JSON.parse(options.body);
          calls.push({ url, body });
          return {
            ok: true,
            async json() {
              return { message: { content: `동적 응답 ${calls.length}` } };
            }
          };
        };
        const adapterOptions = {
          fetchImpl: mockFetch,
          abortControllerImpl: class {
            constructor() { this.signal = { aborted: false }; }
            abort() { this.signal.aborted = true; }
          },
          setTimeoutImpl: () => 1,
          clearTimeoutImpl: () => {}
        };
        const userMessages = ['검색 주제를 알려 드립니다.', '최신 출처를 원합니다.', '핵심 내용과 출처를 확인해 주세요.'];

        for (const userMessage of userMessages) {
          const started = beginMessageRequest(simulationAppState, userMessage, modelInput.value);
          testAssert.equal(started.ok, true, '유효한 메시지 제출이 시작되지 않았습니다.');
          const adapterResult = await requestOllamaChat({
            ...adapterOptions,
            modelId: started.snapshot.modelId,
            messages: started.snapshot.messages,
            requestSnapshot: started.snapshot
          });
          simulationAppState = finishInitialRequest(started.state, started.snapshot, adapterResult);
          testAssert.equal(simulationAppState.turnCount, calls.length, '동적 응답마다 정확히 한 Turn이 추가되지 않았습니다.');
          testAssert.equal(
            simulationAppState.turns[simulationAppState.turns.length - 1].dynamicResponse,
            `동적 응답 ${calls.length}`,
            'Ollama 동적 응답이 마지막 Turn에 보존되지 않았습니다.'
          );
          renderChat(simulationAppState);
        }

        testAssert.equal(calls.length, 3, '세 번의 Ollama 요청이 실행되지 않았습니다.');
        calls.forEach(({ url, body }, index) => {
          testAssert.equal(url, OLLAMA_CHAT_URL, 'AI 요청 URL이 정확한 localhost Ollama API가 아닙니다.');
          testAssert.equal(body.model, 'configured-local-model', '현재 모델 식별자가 요청에 사용되지 않았습니다.');
          testAssert.equal(body.stream, false, 'Ollama 요청이 stream false가 아닙니다.');
          testAssert.equal(body.messages[body.messages.length - 1].content, userMessages[index], '현재 User_Message가 문맥의 마지막에 없습니다.');
        });
        testAssert.equal(documentRef.querySelectorAll('[data-action="complete-scenario"]').length, 1, '세 번째 응답 뒤 완료 동작이 정확히 하나가 아닙니다.');
        testAssert.equal(submitMessage(simulationAppState, '네 번째 메시지', modelInput.value).code, 'ALREADY_FINISHED', '세 번째 Turn 뒤 추가 제출이 허용되었습니다.');

        const completed = completeScenario(simulationAppState);
        testAssert.equal(completed.ok, true, '세 번째 Turn 뒤 완료 처리가 실패했습니다.');
        const saved = repository.save(completed.state.completedScenarioIds);
        testAssert.equal(saved.ok, true, '완료 상태 저장이 실패했습니다.');
        const completedAgain = completeScenario(completed.state);
        testAssert.deepEqual(completedAgain.state.completedScenarioIds, ['information-search'], '재완료 시 ID가 중복되었습니다.');

        const restored = repository.load();
        testAssert.deepEqual(restored, { ok: true, value: ['information-search'] }, '새 초기화에서 완료 상태가 복원되지 않았습니다.');
        const restoredState = createAppState(restored.value, null, '');
        renderCatalog(restoredState);
        testAssert.equal(
          documentRef.querySelector('[data-scenario-id="information-search"] .scenario-status').textContent,
          '✓ 완료',
          '새 초기화 후 완료 표시가 카탈로그에 복원되지 않았습니다.'
        );
        testAssert(storageCalls.every(({ key }) => key === COMPLETION_KEY), '완료 상태가 전용 키 외에 저장·조회되지 않았습니다.');
        testAssert(!storageCalls.some(({ value }) => value && JSON.stringify(value).includes('configured-local-model')), '모델 식별자가 저장소에 기록되었습니다.');
        testAssert(!storageCalls.some(({ value }) => value && JSON.stringify(value).includes('검색 주제를 알려 드립니다.')), '대화 메시지가 저장소에 기록되었습니다.');
        testAssert(SCENARIOS.every((scenario) => !Object.prototype.hasOwnProperty.call(scenario, 'responses')), '시나리오에 responses 목업 데이터가 포함되었습니다.');

        handleReturnToCatalog();
        testAssert.equal(simulationAppState.view, APP_VIEW.CATALOG, '목록 복귀 후 카탈로그 화면이 열리지 않았습니다.');
        testAssert.equal(simulationAppState.selectedScenarioId, null, '목록 복귀 후 선택 시나리오가 남아 있습니다.');
        testAssert.equal(documentRef.querySelectorAll('.scenario-grid').length, 1, '목록 복귀 후 카탈로그가 렌더링되지 않았습니다.');
      });

      selfTests.test('손상 저장값과 저장 실패는 기존 저장값과 현재 완료 상태를 보존한다', ({ assert: testAssert }) => {
        const persisted = ['smart-shopping'];
        const invalidRepository = createCompletionRepository({
          utilsApi: { loadData: () => ['unknown-scenario'], saveData: () => { throw new Error('write forbidden'); } },
          storage: { getItem: () => JSON.stringify(persisted) }
        });
        const invalidResult = invalidRepository.load();
        testAssert.deepEqual(invalidResult, { ok: false, value: [], code: 'INVALID_STORED_VALUE' }, '손상 저장값이 빈 상태로 복원되지 않았습니다.');
        testAssert.deepEqual(persisted, ['smart-shopping'], '손상 저장값을 로드하면서 저장값이 변경되었습니다.');

        const failedRepository = createCompletionRepository({
          utilsApi: { saveData: () => {}, loadData: () => ['different-id'] },
          storage: { getItem: () => JSON.stringify(persisted) }
        });
        testAssert.deepEqual(failedRepository.save(['information-search']), { ok: false, code: 'SAVE_FAILED' }, '저장 검증 실패가 SAVE_FAILED가 아닙니다.');
        const currentState = startScenario(createAppState(['smart-shopping']), 'information-search');
        const completed = completeScenario(deepFreeze({
          ...currentState,
          turns: [
            { userMessage: '첫 질문', dynamicResponse: '첫 응답' },
            { userMessage: '두 번째 질문', dynamicResponse: '두 번째 응답' },
            { userMessage: '세 번째 질문', dynamicResponse: '세 번째 응답' }
          ],
          turnCount: 3
        }));
        testAssert.deepEqual(completed.state.completedScenarioIds, ['smart-shopping', 'information-search'], '저장 실패 전에 현재 완료 상태가 유지되지 않았습니다.');
        testAssert.deepEqual(failedRepository.save(completed.state.completedScenarioIds), { ok: false, code: 'SAVE_FAILED' }, '현재 완료 상태의 저장 실패가 SAVE_FAILED가 아닙니다.');
      });

      queueMicrotask(() => {
        selfTests.run();
      });
    }
  </script>
